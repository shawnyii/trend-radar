version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: trend_radar
      POSTGRES_USER: trend_radar
      POSTGRES_PASSWORD: trend_radar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://trend_radar:trend_radar@db:5432/trend_radar
      TIMEZONE: Asia/Taipei
    ports:
      - "8000:8000"

volumes:
  postgres_data:
