services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: trend_radar
      POSTGRES_USER: trend_radar
      POSTGRES_PASSWORD: trend_radar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trend_radar -d trend_radar"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://trend_radar:trend_radar@db:5432/trend_radar
      TIMEZONE: Asia/Taipei
    ports:
      - "8000:8000"

volumes:
  postgres_data:
