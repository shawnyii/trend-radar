<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ keyword.keyword_text }} | Trend Radar</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <main class="container">
    <a class="back-link" href="/">← 回到 Dashboard</a>
    <section class="panel">
      <h1>{{ keyword.keyword_text }}</h1>
      <p>首次出現：{{ keyword.first_seen_at }} ｜ 最近出現：{{ keyword.last_seen_at }}</p>
      <canvas id="seriesChart"></canvas>
    </section>

    <section class="panel">
      <h2>相關新聞</h2>
      {% if news %}
        <ul class="list compact">
          {% for article in news %}
            <li>
              <a href="{{ article.url }}" target="_blank" rel="noreferrer">{{ article.title }}</a>
              <span>{{ article.publisher or "Unknown" }}</span>
            </li>
          {% endfor %}
        </ul>
      {% else %}
        <p>尚無新聞資料。</p>
      {% endif %}
    </section>
  </main>

  <script>
    const data = {{ series | tojson }};
    const ctx = document.getElementById('seriesChart');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: data.map(item => new Date(item.captured_at).toLocaleString('zh-TW', {
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit'
        })),
        datasets: [{
          label: 'Google Trends 排名',
          data: data.map(item => item.source_rank),
          borderColor: '#ff6b35',
          backgroundColor: 'rgba(255,107,53,0.15)',
          tension: 0.3
        }]
      },
      options: {
        plugins: {
          tooltip: {
            callbacks: {
              label: (context) => {
                const item = data[context.dataIndex];
                const lines = [`排名：第 ${context.parsed.y} 名`];
                if (item.source_value) {
                  lines.push(`熱度值：${Math.round(item.source_value).toLocaleString('zh-TW')}`);
                }
                return lines;
              }
            }
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: '抓取時間'
            }
          },
          y: {
            reverse: true,
            beginAtZero: false,
            title: {
              display: true,
              text: 'Google Trends 排名（1 = 最熱門）'
            },
            ticks: {
              precision: 0,
              stepSize: 1,
              callback: (value) => Number.isInteger(value) ? `第 ${value} 名` : ''
            }
          }
        }
      }
    });
  </script>
</body>
</html>
